  <style id="poster-palette">
      /* Per-event palette sampled from ThomasTruax12.4.25.webp.
         Strategy: the dominant edge colour of the poster sets the panel
         background (#010101 — near-black). The secondary cream is the text
         + accent (#fefcf6 — sampled from the poster's white text/border).
         Because the primary is already dark, dark mode keeps it as-is —
         no swap needed. (Pages with a LIGHT primary swap to secondary in
         dark mode so the panel actually goes dark; this page is already
         night-ready in light mode.)
         The map tokens are deliberately the vibrant accent colours from
         INSIDE the poster (the orange and blue), pinned across themes
         so the styled Google map reads as a coloured inset against the
         dark surrounding panel. */
      :root {
        --poster-primary:   #0a0a0a;     /* edge dominant — near-black */
        --poster-secondary: #fefcf6;     /* edge secondary — cream */
        --poster-text:      #fefcf6;
        --poster-font-display: 'Bowlby One', 'Cormorant Garamond', Georgia, serif;
        --poster-fg-on-primary:   #fff;
        --poster-fg-on-secondary: #111;
        /* Map uses the SECONDARY edge colour as its dominant (same pattern
           as Barratts: panel = primary, map = secondary). Gives the wave
           a real primary→secondary gradient to render and creates contrast
           between the dark panel and the lighter map inset. */
        --map-base:   #fefcf6;           /* cream, dominant landscape */
        --map-accent: #0a0a0a;           /* near-black, roads/water highlights */
      }
      /* No dark-mode @media block needed: primary is already dark, so the
         panel and text colours work in both light and dark without a swap.
         (Compare with Barratts, where primary is cream and dark mode swaps
         to red so the page actually darkens.) */

      /* Logo content-swap. Panel is dark in both modes → always use the
         white-on-transparent logo. This matches the poster-treatment
         default, so no light-mode override needed here. */

      /* Per-page font compensation.
         Bowlby One has more empty space above its cap-height than Abril
         Fatface (Barratts) does, so the eyebrow→title gap reads bigger
         even though margin-bottom on the eyebrow is the same. A small
         negative margin-top on the title pulls it back. */
      body.poster-treatment .event-copy .event-title {
        margin-top: -10px;
      }

      /* Supporting text in events.css defaults to italic Cormorant serif —
         that pairs nicely with a serif-display title (Barratts), but clashes
         with a chunky sans-display title like Bowlby One. Switch the
         supporting text to the UI font on this page so it reads as a
         coherent system. */
      body.poster-treatment .event-copy .special-guests-label,
      body.poster-treatment .event-copy .event-date {
        font-family: var(--font-ui);
        font-style: normal;
        font-weight: var(--weight-med);
        letter-spacing: 0.02em;
      }
    </style>

  <script>
    function initMap() {
      const root = getComputedStyle(document.documentElement);
      // Map colours pinned to --map-base / --map-accent (not --poster-primary
      // / --poster-secondary, which swap in dark mode). Map appearance is
      // unchanged across themes.
      const base   = (root.getPropertyValue('--map-base')   || '#a8c5cf').trim();
      const accent = (root.getPropertyValue('--map-accent') || '#d4822d').trim();

      const styles = [
        { elementType: 'geometry',            stylers: [{ color: base }] },
        { elementType: 'labels.icon',         stylers: [{ visibility: 'off' }] },
        { elementType: 'labels.text.fill',    stylers: [{ color: accent }] },
        { elementType: 'labels.text.stroke',  stylers: [{ color: base }] },
        { featureType: 'administrative.land_parcel', elementType: 'labels', stylers: [{ visibility: 'off' }] },
        { featureType: 'administrative.locality',    elementType: 'labels.text.fill', stylers: [{ color: accent }] },
        { featureType: 'landscape', elementType: 'geometry',         stylers: [{ color: base }] },
        { featureType: 'poi',       elementType: 'geometry',         stylers: [{ color: base }] },
        { featureType: 'poi',       elementType: 'labels.text',      stylers: [{ visibility: 'off' }] },
        { featureType: 'poi.park',  elementType: 'geometry.fill',    stylers: [{ color: '#ffffff' }] },
        { featureType: 'road',      elementType: 'geometry',         stylers: [{ color: accent }] },
        { featureType: 'road',      elementType: 'geometry.stroke',  stylers: [{ color: base }] },
        { featureType: 'road',      elementType: 'labels.text.fill', stylers: [{ color: base }] },
        { featureType: 'road',      elementType: 'labels.text.stroke', stylers: [{ color: accent }] },
        { featureType: 'transit',   elementType: 'geometry',         stylers: [{ color: base }] },
        { featureType: 'water',     elementType: 'geometry',         stylers: [{ color: accent }] },
        { featureType: 'water',     elementType: 'labels.text.fill', stylers: [{ color: base }] },
      ];

      const center = { lat: 52.2429854, lng: -0.8912883 };
      // Google Maps shortlink that resolves directly to THE LAB's place
      // page — preserves the venue name and place ID, not just coords.
      const searchUrl =
        'https://maps.app.goo.gl/wejJPVXBdi9W4e8Q9';

      const map = new google.maps.Map(document.getElementById('venue-map'), {
        center,
        zoom: 15,
        disableDefaultUI: true,
        zoomControl: false,
        gestureHandling: 'cooperative',
        styles
      });

      // Custom zoom controls themed in the poster palette, replacing
      // Google's default white +/- buttons.
      const zoomControls = document.createElement('div');
      zoomControls.className = 'venue-map-zoom-controls';
      zoomControls.innerHTML = `
        <button type="button" class="venue-map-zoom-btn" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          </svg>
        </button>
        <button type="button" class="venue-map-zoom-btn" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          </svg>
        </button>
      `;
      const [zInBtn, zOutBtn] = zoomControls.querySelectorAll('button');
      zInBtn.addEventListener('click', () => map.setZoom(map.getZoom() + 1));
      zOutBtn.addEventListener('click', () => map.setZoom(map.getZoom() - 1));
      map.controls[google.maps.ControlPosition.RIGHT_CENTER].push(zoomControls);

      // Two overlapping markers: a coloured teardrop pin (path), with the
      // ELE logo composited on top of the bulb. Both share a click handler.
      const pinMarker = new google.maps.Marker({
        position: center,
        map,
        title: 'The Lab',
        cursor: 'pointer',
        zIndex: 1,
        icon: {
          path: 'M28 0 C12.54 0 0 12.54 0 28 C0 49 28 72 28 72 S56 49 56 28 C56 12.54 43.46 0 28 0 Z',
          fillColor: accent,
          fillOpacity: 1,
          strokeColor: base,
          strokeWeight: 2,
          scale: 1,
          anchor: new google.maps.Point(28, 70)
        }
      });

      const logoMarker = new google.maps.Marker({
        position: center,
        map,
        title: 'The Lab',
        cursor: 'pointer',
        zIndex: 2,
        icon: {
          // Teardrop fillColor is --map-accent (#0a0a0a, near-black on
          // this page) — use the white-on-transparent logo variant so the
          // mark reads against the dark bulb. (Barratts uses the
          // dark-on-transparent logo on a cream bulb.)
          // Note: ELE_Logo_Dark.webp is 473×354 (≈4:3), not square — use
          // scaledSize that matches the source aspect so the logo isn't
          // vertically squashed; anchor compensates to keep the image
          // centred on the bulb (geo point = (28, 70), bulb centre = (28, 28),
          // so image centre should sit 42px above the geo anchor).
          url: '../index/pictures/icons/ELE_Logo_Dark.webp',
          scaledSize: new google.maps.Size(36, 27),
          anchor: new google.maps.Point(18, 55)
        }
      });

      const openSearch = () => window.open(searchUrl, '_blank', 'noopener,noreferrer');
      pinMarker.addListener('click', openSearch);
      logoMarker.addListener('click', openSearch);
    }
  </script>
  <script>
    // Pick the right Maps JS key for the current host. Both keys are
    // restricted by HTTP referrer in GCP, so they're effectively public —
    // putting them in the HTML is the supported model.
    //   - localhost / 127.0.0.1 → dev key (restricted to localhost)
    //   - everywhere else       → prod key (restricted to eightlimbentertainment.com)
    (function () {
      var h = window.location.hostname;
      var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '';
      var key = isLocal
        ? 'AIzaSyCq0pj0fzZLuKTZXkVte-k6_vr6hsTTfuM'
        : 'AIzaSyAMRP1bo-bhDNgR84EjUl7A2si-pRkU3XQ';
      var s = document.createElement('script');
      s.async = true;
      s.defer = true;
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + key
            + '&loading=async&callback=initMap';
      document.head.appendChild(s);
    })();
  </script>
